<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0B0B0D">
<meta name="apple-mobile-web-app-title" content="Z Requests">
<title>Z Requests</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style id="zr-css">
  :root {
    --bg: #0B0B0D; --card: #17171A; --card-border: #26262B; --paper: #E9E6DF;
    --ink: #131313; --ink-soft: #6B675E; --text: #F2F1ED; --muted: #8A8A93;
    --faint: #55555E; --red: #C41414; --gold: #B08A3E; --green: #4C9A57; --amber: #C99A3C;
  }
  * { box-sizing: border-box; }
  html { color-scheme: dark; }
  body { margin: 0; background: radial-gradient(1100px 380px at 50% -120px, rgba(196,20,20,0.10), rgba(11,11,13,0) 70%), var(--bg); color: var(--text); font-family: Archivo, system-ui, sans-serif; min-height: 100vh; }
  a { color: var(--gold); text-decoration: none; } a:hover { color: var(--red); }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
  .wrap { max-width: 980px; margin: 0 auto; padding: 24px 28px 60px; display: flex; flex-direction: column; gap: 16px; }
  .hdr { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
  .hdr-left { display: flex; align-items: center; gap: 13px; }
  .zmark { width: 32px; height: 32px; border-radius: 50%; background: var(--red); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 19px; color: #fff; }
  .brand { font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 600; letter-spacing: .28em; }
  .brand-sub { font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: .18em; color: #6E6E77; }
  .live { display: flex; align-items: center; gap: 7px; border: 1px solid #2A2A30; border-radius: 999px; padding: 4px 11px; font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: .12em; color: var(--muted); }
  .live-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--red); animation: pulse 2.2s infinite; }
  .card { background: var(--card); border: 1px solid var(--card-border); border-radius: 10px; padding: 18px 20px; display: flex; flex-direction: column; gap: 11px; }
  .paper { background: var(--paper); border: none; color: var(--ink); }
  .card-label { font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: .24em; color: var(--muted); }
  .paper .card-label { color: var(--ink-soft); }
  .card-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
  .who { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { border: 1px solid #CFCABF; background: transparent; color: var(--ink); border-radius: 999px; padding: 6px 13px; font-family: Archivo, system-ui, sans-serif; font-size: 13px; font-weight: 600; cursor: pointer; }
  .chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .kinds { display: flex; gap: 6px; flex-wrap: wrap; }
  .kind { border: 1px dashed #B9B3A6; background: transparent; color: var(--ink-soft); border-radius: 6px; padding: 5px 10px; font-family: 'JetBrains Mono', monospace; font-size: 9px; letter-spacing: .14em; cursor: pointer; }
  .kind:hover { border-color: var(--ink); color: var(--ink); }
  textarea { width: 100%; min-height: 110px; resize: vertical; border: 1px solid #CFCABF; border-radius: 6px; padding: 11px 13px; font-family: Archivo, system-ui, sans-serif; font-size: 14px; line-height: 1.45; color: var(--ink); background: #F5F3EE; }
  textarea:focus, .chip:focus-visible, .btn:focus-visible, .kind:focus-visible, .reply-box input:focus { outline: 2px solid var(--gold); outline-offset: 1px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .check { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: var(--ink); cursor: pointer; }
  .check input { width: 16px; height: 16px; accent-color: var(--red); }
  .btn { border: 1px solid #3A3A41; background: transparent; color: #C9C7C0; border-radius: 6px; padding: 10px 15px; font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 600; letter-spacing: .16em; cursor: pointer; }
  .btn:hover { border-color: var(--gold); color: var(--gold); }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn-primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .btn-primary:hover { background: var(--red); border-color: var(--red); color: #fff; }
  .btn-sm { padding: 6px 10px; font-size: 9px; }
  .hint { font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: .06em; color: var(--ink-soft); line-height: 1.5; }
  .notice { background: #2A1A1A; border: 1px solid #5A2323; color: #F2D6D6; border-radius: 8px; padding: 10px 14px; font-size: 13px; line-height: 1.45; }
  .board-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .filters { display: flex; gap: 6px; flex-wrap: wrap; }
  .filters .btn[aria-pressed="true"] { border-color: var(--gold); color: var(--gold); }
  .req { gap: 10px; }
  .req-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .status { font-family: 'JetBrains Mono', monospace; font-size: 9px; letter-spacing: .16em; border: 1px solid currentColor; border-radius: 999px; padding: 3px 9px; }
  .s-queued { color: var(--gold); } .s-working { color: var(--amber); animation: pulse 2.2s infinite; } .s-done { color: var(--green); } .s-needs-info { color: var(--amber); } .s-with-eric { color: var(--red); }
  .req-who { font-size: 13px; font-weight: 700; }
  .req-time { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--muted); margin-left: auto; }
  .req-text { font-size: 14px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
  .result { background: var(--paper); color: var(--ink); border-radius: 8px; padding: 12px 14px; font-size: 14px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
  .result-label { font-family: 'JetBrains Mono', monospace; font-size: 9px; letter-spacing: .2em; color: var(--ink-soft); margin-bottom: 6px; }
  .thread { display: flex; flex-direction: column; gap: 6px; border-left: 2px solid var(--card-border); padding-left: 12px; }
  .msg { font-size: 13px; line-height: 1.45; white-space: pre-wrap; word-break: break-word; }
  .msg b { font-weight: 700; } .msg .at { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: var(--faint); margin-left: 6px; }
  .reply-box { display: flex; gap: 8px; }
  .reply-box input { flex: 1; background: #121215; border: 1px solid #2A2A30; border-radius: 6px; color: var(--text); font-family: Archivo, system-ui, sans-serif; font-size: 13px; padding: 9px 12px; }
  .req-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .mail-note { font-family: 'JetBrains Mono', monospace; font-size: 9px; letter-spacing: .1em; color: var(--muted); }
  .empty { border: 1px dashed #2E2E35; border-radius: 8px; padding: 22px; text-align: center; font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: .16em; color: var(--faint); }
  .ftr { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 6px; font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: .14em; color: var(--faint); }
  #toast { position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%); background: #F2F1ED; color: var(--ink); font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: .08em; padding: 10px 18px; border-radius: 6px; opacity: 0; pointer-events: none; transition: opacity .25s; max-width: 90vw; text-align: center; }
  #toast.show { opacity: 1; }
  @media (prefers-reduced-motion: reduce) { .live-dot, .s-working { animation: none; } }
  @media (max-width: 700px) { .wrap { padding: 16px 14px 60px; } .req-time { margin-left: 0; flex-basis: 100%; } .btn { flex: 1 1 auto; text-align: center; } }
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" role="status"></div>
<script id="zr-app">
(function () {
  var API_BASE = 'https://xhywanrbgyeruptnsmyr.supabase.co/functions/v1/z-requests';
  var NAMES = ['Mary', 'Julia', 'Cody', 'Eric'];
  var KINDS = [
    ['YT DESCRIPTION', 'YouTube description for this video: <paste link, or say "this morning\'s live">'],
    ['BLOG', 'Blog post from this broadcast: <date, or paste the transcript below>\n\n'],
    ['TV TITLES + DESC', 'Titles and description entry for episode <number or date>'],
    ['SUMMARY', 'Summary and key points from the <date> broadcast. Include the scripture references and 3 quotes.'],
    ['DOC DRAFT', 'Draft a Google Doc: <what it is, who it\'s for, source text below>\n\n'],
    ['RECURRING', 'Set up a recurring task: every <day/time>, <what>, send it to <who>']
  ];
  var STATUS = { queued: 'QUEUED', working: 'WORKING', done: 'DONE', 'needs-info': 'NEEDS YOUR ANSWER', 'with-eric': 'WITH ERIC' };
  var KEY = (function () {
    try {
      var q = new URLSearchParams(location.search).get('k');
      var h = new URLSearchParams(location.hash.replace(/^#/, '')).get('k');
      var k = h || q || '';
      if (k) localStorage.setItem('zr-key', k); else k = localStorage.getItem('zr-key') || '';
      if (q && !h) history.replaceState(null, '', location.pathname + '#k=' + q);
      return k;
    } catch (e) { return ''; }
  })();
  var API = API_BASE + '?k=' + encodeURIComponent(KEY);
  var state = { v: 1, requests: [] };
  var loaded = false, badKey = !KEY, filter = 'open', busy = false;
  var draft = { who: null, text: '', emailMe: true };

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function linkify(s) { return esc(s).replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>'); }
  function fmt(iso) {
    try { var d = new Date(iso); return d.toLocaleString('en-US', { timeZone: 'America/Denver', weekday: 'short', month: 'numeric', day: 'numeric', hour: 'numeric', minute: '2-digit' }).replace(' AM', 'a').replace(' PM', 'p'); } catch (e) { return iso; }
  }
  function toast(m) { var t = document.getElementById('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(function () { t.classList.remove('show'); }, 3200); }

  function api(body, okMsg, stash) {
    if (busy) return; busy = true;
    if (stash) { try { sessionStorage.setItem('zr-draft', JSON.stringify(stash)); } catch (e) {} }
    toast('Sending…');
    fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
      .then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { return { ok: r.ok, status: r.status, j: j }; }); })
      .then(function (res) {
        busy = false;
        if (res.status === 404 && !res.j.error) { badKey = true; render(); return; }
        if (!res.ok || !res.j.state) { toast(res.j.error || ('Could not send (' + res.status + '). Try again.')); return; }
        try { sessionStorage.removeItem('zr-draft'); } catch (e) {}
        if (body.op === 'submit') draft.text = '';
        state = res.j.state; loaded = true; render(); toast(okMsg);
      })
      .catch(function () { busy = false; toast('No connection. Try again.'); });
  }
  function refresh(first) {
    if (!KEY) { render(); return; }
    if (!first && (document.hidden || busy)) return;
    if (!first && [].some.call(document.querySelectorAll('[data-reply]'), function (i) { return i.value; })) return;
    fetch(API, { headers: { Accept: 'application/json' } }).then(function (r) {
      if (r.status === 404) { badKey = true; render(); return null; }
      return r.ok ? r.json() : null;
    }).then(function (j) {
      if (j && j.state && (!loaded || JSON.stringify(j.state) !== JSON.stringify(state))) {
        var t = document.getElementById('zr-text'); if (t) draft.text = t.value;
        state = j.state; loaded = true; badKey = false; render();
      }
    }).catch(function () { if (!loaded) toast('No connection. Pull to refresh.'); });
  }

  function submit() {
    var who = draft.who, text = (draft.text || '').trim();
    if (!who) { toast('Pick your name first.'); return; }
    if (text.length < 8) { toast('Say a bit more about what you need.'); return; }
    api({ op: 'submit', who: who, text: text, emailMe: !!draft.emailMe }, 'Sent. Claude picks it up within 30 minutes (6a–7:30p).', { who: who, text: text, emailMe: draft.emailMe });
  }
  function reply(id, text) {
    text = (text || '').trim(); if (!text) return;
    api({ op: 'reply', id: id, text: text }, 'Reply sent. Back in the queue.', { reply: { id: id, text: text } });
  }
  function askEmail(id) {
    var r = state.requests.filter(function (x) { return x.id === id; })[0]; if (!r) return;
    api({ op: 'email', id: id }, 'Will email the result to ' + r.email + ' on the next sweep.');
  }
  function archive(id) { api({ op: 'archive', id: id }, 'Archived.'); }

  function render() {
    var app = document.getElementById('app');
    var open = state.requests.filter(function (r) { return !r.archived; });
    var shown = open.filter(function (r) { return filter === 'all' ? true : filter === 'mine' ? r.who === draft.who : r.status !== 'done'; });
    var nQ = open.filter(function (r) { return r.status === 'queued' || r.status === 'working'; }).length;
    var h = '';
    h += '<div class="wrap">';
    h += '<div class="hdr"><div class="hdr-left"><div class="zmark">Z</div><div><div class="brand">Z REQUESTS</div><div class="brand-sub">MEDIA TEAM · CLAUDE LANE</div></div></div>';
    h += '<div class="live"><span class="live-dot"></span>SWEEP EVERY 30 MIN · 6A–7:30P MT' + (nQ ? ' · ' + nQ + ' IN QUEUE' : '') + '</div></div>';
    if (badKey) h += '<div class="notice">This link isn\'t valid. Open the exact link Eric sent you (it ends in a long code), or ask him for a fresh one.</div>';
    h += '<div class="card paper"><div class="card-head"><div class="card-label">NEW REQUEST</div><div class="kinds">' + KINDS.map(function (k, i) { return '<button class="kind" data-kind="' + i + '" type="button">' + k[0] + '</button>'; }).join('') + '</div></div>';
    h += '<div class="who">' + NAMES.map(function (n) { return '<button class="chip" type="button" data-who="' + n + '" aria-pressed="' + (draft.who === n) + '">' + n + '</button>'; }).join('') + '</div>';
    h += '<textarea id="zr-text" placeholder="What do you need? Links, dates, episode numbers and pasted text all work here.">' + esc(draft.text) + '</textarea>';
    h += '<div class="row"><label class="check"><input type="checkbox" id="zr-email"' + (draft.emailMe ? ' checked' : '') + '> Email me the result</label>';
    h += '<button class="btn btn-primary" id="zr-send" type="button"' + (badKey ? ' disabled' : '') + '>SEND TO CLAUDE</button></div>';
    h += '<div class="hint">The result shows up on this page under your request. Reply on the card to tweak it. Graphics, video, and anything that publishes get flagged to Eric instead.</div></div>';
    h += '<div class="board-head"><div class="card-label">REQUESTS</div><div class="filters">' + [['open', 'OPEN'], ['mine', 'MINE'], ['all', 'ALL']].map(function (f) { return '<button class="btn btn-sm" type="button" data-filter="' + f[0] + '" aria-pressed="' + (filter === f[0]) + '">' + f[1] + '</button>'; }).join('') + '</div></div>';
    if (!shown.length) h += '<div class="empty">' + (!loaded && !badKey ? 'LOADING…' : filter === 'mine' && !draft.who ? 'PICK YOUR NAME ABOVE' : 'NOTHING HERE YET') + '</div>';
    shown.forEach(function (r) {
      h += '<div class="card req" data-id="' + r.id + '"><div class="req-top"><span class="status s-' + r.status + '">' + (STATUS[r.status] || r.status.toUpperCase()) + '</span><span class="req-who">' + esc(r.who) + '</span><span class="req-time">' + fmt(r.created) + '</span></div>';
      h += '<div class="req-text">' + linkify(r.text) + '</div>';
      if (r.thread && r.thread.length) h += '<div class="thread">' + r.thread.map(function (m) { return '<div class="msg"><b>' + esc(m.from) + '</b><span class="at">' + fmt(m.at) + '</span><br>' + linkify(m.text) + '</div>'; }).join('') + '</div>';
      if (r.result) h += '<div class="result"><div class="result-label">RESULT' + (r.resultAt ? ' · ' + fmt(r.resultAt) : '') + '</div>' + linkify(r.result) + '</div>';
      h += '<div class="req-actions">';
      h += '<div class="reply-box" style="flex:1 1 260px"><input type="text" placeholder="Reply — shorter, add X, redo with Y…" data-reply="' + r.id + '"><button class="btn btn-sm" type="button" data-send-reply="' + r.id + '">SEND</button></div>';
      if (r.result) h += (r.emailMe && !r.emailSent ? '<span class="mail-note">EMAILING TO ' + esc(r.email).toUpperCase() + '</span>' : r.emailSent ? '<span class="mail-note">EMAILED</span>' : '<button class="btn btn-sm" type="button" data-email="' + r.id + '">EMAIL ME THIS</button>');
      h += '<button class="btn btn-sm" type="button" data-archive="' + r.id + '">ARCHIVE</button>';
      h += '</div></div>';
    });
    h += '<div class="ftr"><span>WORKED BY CLAUDE ON ERIC\'S ACCOUNT · REPLIES AS ERIC</span><span>' + open.length + ' OPEN · ' + state.requests.length + ' TOTAL</span></div>';
    h += '</div>';
    app.innerHTML = h;

    app.querySelectorAll('[data-who]').forEach(function (b) { b.onclick = function () { draft.who = b.getAttribute('data-who'); draft.text = document.getElementById('zr-text').value; render(); }; });
    app.querySelectorAll('[data-kind]').forEach(function (b) { b.onclick = function () { var t = document.getElementById('zr-text'); var tpl = KINDS[+b.getAttribute('data-kind')][1]; t.value = (t.value.trim() ? t.value.trim() + '\n\n' : '') + tpl; draft.text = t.value; t.focus(); }; });
    app.querySelectorAll('[data-filter]').forEach(function (b) { b.onclick = function () { filter = b.getAttribute('data-filter'); draft.text = document.getElementById('zr-text').value; render(); }; });
    document.getElementById('zr-text').oninput = function (e) { draft.text = e.target.value; };
    document.getElementById('zr-email').onchange = function (e) { draft.emailMe = e.target.checked; };
    document.getElementById('zr-send').onclick = function () { draft.text = document.getElementById('zr-text').value; submit(); };
    app.querySelectorAll('[data-send-reply]').forEach(function (b) { b.onclick = function () { var id = b.getAttribute('data-send-reply'); reply(id, app.querySelector('[data-reply="' + id + '"]').value); }; });
    app.querySelectorAll('[data-reply]').forEach(function (i) { i.onkeydown = function (e) { if (e.key === 'Enter') { reply(i.getAttribute('data-reply'), i.value); } }; });
    app.querySelectorAll('[data-email]').forEach(function (b) { b.onclick = function () { askEmail(b.getAttribute('data-email')); }; });
    app.querySelectorAll('[data-archive]').forEach(function (b) { b.onclick = function () { archive(b.getAttribute('data-archive')); }; });
  }

  try {
    var st = JSON.parse(sessionStorage.getItem('zr-draft') || 'null');
    if (st) {
      if (st.who) { draft.who = st.who; draft.text = st.text || ''; draft.emailMe = st.emailMe !== false; }
      sessionStorage.removeItem('zr-draft');
      setTimeout(function () { toast('Your last send may not have gone through — check the list, then send again if it\'s missing.'); }, 600);
    }
  } catch (e) {}
  try { var lw = localStorage.getItem('zr-who'); if (lw && NAMES.indexOf(lw) >= 0 && !draft.who) draft.who = lw; } catch (e) {}
  var _render = render; render = function () { try { if (draft.who) localStorage.setItem('zr-who', draft.who); } catch (e) {} _render(); };
  render();
  refresh(true);
  setInterval(function () { refresh(false); }, 45000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) refresh(false); });
})();
</script>
</body>
</html>
